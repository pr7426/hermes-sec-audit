services:
  - type: web
    name: hermes-sec-audit
    runtime: docker
    plan: starter
    disk:
      name: hermessec-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BACKBOARD_API_KEY
        sync: false
      - key: HERMES_API_TOKEN
        sync: false
      - key: HERMES_ALLOWED_ORIGINS
        sync: false
      - key: HERMES_ENABLE_REMOTE_MEMORY
        value: "false"
      - key: HERMES_RATE_LIMIT
        value: "30"
      - key: HERMES_AUDIT_DB_PATH
        value: /var/data/hermessec.db
